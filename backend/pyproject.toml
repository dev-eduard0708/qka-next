[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qka-next"
version = "0.1.0"
description = "QKA-Next Python/FastAPI foundation (sibling of the existing .NET QKA app)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pillow>=11.0",
  "pymupdf>=1.24",
  "mcp>=2.3",
  "openai>=1.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
qka-api = "qka_api.main:run"
qka-worker = "qka_workers.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
